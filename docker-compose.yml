services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public"
      - "traefik.tcp.routers.pfb-mysql.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.pfb-mysql.entrypoints=mysql"
      - "traefik.tcp.services.pfb-mysql.loadbalancer.server.port=3306"

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.pfb-pma.rule=Host(`pma.andrewdover.com`)"
      - "traefik.http.routers.pfb-pma.entrypoints=websecure"
      - "traefik.http.routers.pfb-pma.tls.certresolver=letsencrypt"

networks:
  internal:
  traefik:
    external: true

volumes:
  mysql_data:
