services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public"
      - "traefik.http.routers.pfb-pma.rule=Host(`pma.andrewdover.com`)"
      - "traefik.http.routers.pfb-pma.entrypoints=websecure"
      - "traefik.http.routers.pfb-pma.tls.certresolver=letsencrypt"

networks:
  internal:
  public:
    external: true

volumes:
  mysql_data:
